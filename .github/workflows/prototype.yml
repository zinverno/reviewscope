name: ReviewScope frontend
on:
  pull_request:
    paths:
      - 'prototypes/reviewscope-ui/**'
      - '.github/workflows/prototype.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/reviewscope-ui/**'
      - '.github/workflows/prototype.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototypes/reviewscope-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/reviewscope-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
