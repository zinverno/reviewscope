name: ReviewScope frontend
on:
  pull_request:
    paths:
      - 'prototypes/reviewscope-ui/**'
      - '.github/workflows/prototype.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/reviewscope-ui/**'
      - '.github/workflows/prototype.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototypes/reviewscope-ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/reviewscope-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser
      - run: BROWSER=firefox npm run test:browser
      - name: Check out the previous owner-reviewed prototype for matching captures
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/reviewscope-pr03-ux-prototype'
        uses: actions/checkout@v4
        with:
          ref: bf3c3e0abb2eaf6589e463f19d7aab255b18e6bd
          path: .ux-before
          persist-credentials: false
      - name: Build the comparison snapshot
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/reviewscope-pr03-ux-prototype'
        working-directory: .ux-before/prototypes/reviewscope-ui
        run: npm ci && npm run build
      - name: Record the draft UX review
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/reviewscope-pr03-ux-prototype'
        run: npm run capture:ux -- "$RUNNER_TEMP/reviewscope-pr03-media" "$GITHUB_WORKSPACE/.ux-before/prototypes/reviewscope-ui/dist"
      - name: Attach recordings and screenshots
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/reviewscope-pr03-ux-prototype'
        uses: actions/upload-artifact@v4
        with:
          name: reviewscope-pr03-ux-v10
          path: ${{ runner.temp }}/reviewscope-pr03-media
          retention-days: 14
          if-no-files-found: error
