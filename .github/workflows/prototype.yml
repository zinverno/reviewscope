name: ReviewScope frontend
on:
  pull_request:
    paths:
      - 'prototypes/reviewscope-ui/**'
      - '.github/workflows/prototype.yml'
  push:
    branches: [main]
    paths:
      - 'prototypes/reviewscope-ui/**'
      - '.github/workflows/prototype.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: prototypes/reviewscope-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/reviewscope-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Record the draft UX review
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/reviewscope-pr03-ux-prototype'
        run: npm run capture:ux -- "$RUNNER_TEMP/reviewscope-pr03-media"
      - name: Attach recordings and screenshots
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/reviewscope-pr03-ux-prototype'
        uses: actions/upload-artifact@v4
        with:
          name: reviewscope-pr03-ux-v3
          path: ${{ runner.temp }}/reviewscope-pr03-media
          retention-days: 14
          if-no-files-found: error
