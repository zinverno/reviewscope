name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  operational:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: operational
            artifact: synthetic-cabinet-acceptance
          - check: human-review
            artifact: synthetic-human-review
          - check: aspect-decisions
            artifact: synthetic-aspect-decisions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[operational,access,dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: prototypes/reviewscope-ui/package-lock.json
      - name: Build local cabinet and install synthetic acceptance browsers
        if: matrix.check != 'human-review'
        working-directory: prototypes/reviewscope-ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rs-browsers
        run: |
          command -v certutil || sudo apt-get install -y libnss3-tools
          npm ci
          npm run build
          npx playwright install --with-deps chromium firefox
      - name: Migrate, backfill and restore on disposable PostgreSQL
        env:
          RS_TEST_PG_MAJOR: "16"
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rs-browsers
          RS_TEST_BROWSER_OUT: ${{ runner.temp }}/rs-cabinet-synthetic
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -VV
          if [ "${{ matrix.check }}" = operational ]; then
            python -m pytest -q tests/test_access.py
            bash operational/test-isolated.sh -s --tb=short -k 'reviewer_context_resource_boundary or reviewer_context_upgrade'
            bash operational/test-isolated.sh -s --tb=short -k 'not (reviewer_context_resource_boundary or reviewer_context_upgrade or decision or test_human)'
          elif [ "${{ matrix.check }}" = aspect-decisions ]; then
            bash operational/test-isolated.sh -s --tb=short -k 'decision and not test_human'
          else
            mkdir -p "$RS_TEST_BROWSER_OUT"
            bash operational/test-isolated.sh -s --tb=short --junitxml="$RS_TEST_BROWSER_OUT/human.xml" -k test_human
            RS_MEASURE_DECISIONS=1 bash operational/test-isolated.sh -s --tb=short --junitxml="$RS_TEST_BROWSER_OUT/diverse.xml" -k 'decision_profile_resource and diverse'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/rs-cabinet-synthetic
          retention-days: 14
          if-no-files-found: error
      - name: Export local TLS workspace OpenAPI
        if: matrix.check == 'operational'
        run: |
          python -c 'import json; from reviewscope.access.http import create_app; print(json.dumps(create_app().openapi(), sort_keys=True, indent=2))' > workspace-openapi.json
      - uses: actions/upload-artifact@v4
        if: matrix.check == 'operational'
        with:
          name: workspace-openapi
          path: workspace-openapi.json

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Check patch whitespace
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --check HEAD^1 HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[api,access,dev]"

      - name: Verify demo artifact
        run: python scripts/build_public_demo_dataset.py --verify

      - name: Lint
        run: ruff check .

      - name: Offline HTTP contract without the embedding backend
        run: python -m pytest tests/test_api.py

      - name: Prepare full-suite test environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[embeddings]"
          python scripts/generate_demo_data.py
          cp demo/reviewscope_demo.duckdb data/reviewscope.duckdb

      - name: Tests
        run: python -m pytest -o addopts="" -q
