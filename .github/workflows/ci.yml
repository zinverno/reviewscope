name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  operational:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[operational,access,dev]"
      - name: Migrate, backfill and restore on disposable PostgreSQL
        env:
          RS_TEST_PG_MAJOR: "16"
        run: |
          python -VV
          python -m pytest -q tests/test_access.py
          bash operational/test-postgres.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check patch whitespace
        run: git diff --check HEAD^1 HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ".[api,access,dev]"

      - name: Verify demo artifact
        run: python scripts/build_public_demo_dataset.py --verify

      - name: Lint
        run: ruff check .

      - name: Offline HTTP contract without the embedding backend
        run: python -m pytest tests/test_api.py

      - name: Prepare full-suite test environment
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[embeddings]"
          python scripts/generate_demo_data.py
          cp demo/reviewscope_demo.duckdb data/reviewscope.duckdb

      - name: Tests
        run: python -m pytest -o addopts="" -q
